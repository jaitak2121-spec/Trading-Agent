[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "safety-first-trading-app"
version = "0.1.0"
description = "Safety-first local paper-trading application"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
trading-paper = "trading.app.__main__:main"

[tool.setuptools.packages.find]
include = ["trading*"]
