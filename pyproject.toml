[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "safety-first-trading-app"
version = "0.3.3rc3"
description = "Safety-first local paper-trading application"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
historical-data = ["cryptography>=43"]

[project.scripts]
trading-paper = "trading.app.__main__:main"
trading-paper-account = "trading.app.paper_account:main"

[tool.setuptools.packages.find]
include = ["trading*"]
